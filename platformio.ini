; =============================================================================
; CYD-GB: Game Boy Emulator for ESP32 Cheap Yellow Display
; Board: ESP32-2432S024 (2.4" CYD, ST7789)
; =============================================================================

[platformio]
default_envs = cyd

[env:cyd]
platform = espressif32@6.5.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
extra_scripts =
    pre:scripts/pre_build_info.py
    post:scripts/post_build_timestamp.py

; Two emulator cores live in this tree and exactly one may be linked. The
; selection is here, in the build system, and never in the preprocessor: no
; #ifdef picks a core, and neither bridge knows the other exists. This
; environment is the Peanut-GB one, so the gnuboy bridge is not compiled.
build_src_filter = +<*> -<emulator_bridge_gnuboy.cpp>

board_build.partitions = partitions.csv
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.flash_mode = qio

; A bench-only bypass exists that makes the firmware load one fixed ROM and
; never read a tag. It is a build flag ONLY, passed per invocation through
; PLATFORMIO_BUILD_FLAGS, and it is deliberately not configured here: a
; device built from this file always reads its cartridge.
;
; The flag's name and the exact invocation are documented at its #ifdef in
; src/main.cpp. They are not repeated here on purpose — a guard test asserts
; this file does not so much as mention the flag, so that no default build
; can ever acquire it by someone uncommenting a line.
; The framework appends its own -Os after build_flags, and GCC takes the last
; optimisation flag, so without this every first-party file compiled at -Os
; (BUG-0008). -O2 is the intent; the cost is flash, the gain is inlining and
; unrolling in the emulator and the render path.
;
; The framework also passes -fno-jump-tables -fno-tree-switch-conversion,
; an ESP-IDF default that exists so IRAM-resident interrupt code never
; indexes a table in flash while the cache is off. Nothing first-party runs
; a switch from an ISR, and the flag turns Peanut-GB's 256-way opcode
; dispatch into a compare-and-branch tree on every emulated instruction
; (BUG-0011). Unflagged, so the interpreter dispatches through a table.
build_unflags =
    -Os
    -fno-jump-tables
    -fno-tree-switch-conversion
build_flags =
    -O2
    -DCORE_DEBUG_LEVEL=1
    -DUSER_SETUP_LOADED=1
    ; === ST7789 TFT Display (HSPI) ===
    -DST7789_DRIVER
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DTFT_MOSI=13
    -DTFT_MISO=12
    -DTFT_SCLK=14
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=-1
    ; Must equal TFT_PIN_BL in include/hw_config.h. 21 is CN1 pad 3 (I2C SCL) on
    ; this board's silkscreen; 27 is the backlight (silkscreen read 2026-09-14).
    -DTFT_BL=27
    -DTFT_BACKLIGHT_ON=HIGH
    ; This panel batch wants BGR. Undefined, ST7789_Defines.h falls to
    ; TFT_MAD_RGB for a 240x320 panel (no CGRAM_OFFSET) and red renders
    ; blue. Pairs with tft.invertDisplay(false) in src/display.cpp -
    ; either alone leaves the panel wrong (BUG-0004).
    -DTFT_RGB_ORDER=TFT_BGR
    ; 80 MHz, bench item 7 (2026-09-17): 40 MHz capped the display path at
    ; 36 fps with core 1 stalled 9.9 ms a frame; 80 MHz pushes a frame in
    ; 16.1 ms with zero queue overflows and no artefacts through five
    ; minutes of play. 55 MHz is not a real point: the IDF driver programs
    ; 40 MHz for it (80 / n, n >= 2, or 80 outright above 60).
    -DSPI_FREQUENCY=80000000
    -DSPI_READ_FREQUENCY=16000000
    -DUSE_HSPI_PORT
    ; === Fonts ===
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_FONT6=1
    -DLOAD_FONT7=1
    -DLOAD_FONT8=1
    -DLOAD_GFXFF=1
    -DSMOOTH_FONT=1
    ; === SD Card (VSPI) ===
    -DSD_CS=5
    -DSD_MOSI=23
    -DSD_MISO=19
    -DSD_SCK=18
    ; === Emulator ===
    -DENABLE_LCD=1
    -DENABLE_SOUND=1
    -DPEANUT_GB_HIGH_LCD_ACCURACY=0
    -DPEANUT_GB_USE_DOUBLE_WIDTH_PALETTE=0
    ; Vendored default, pinned explicitly: the 12-colour path is what makes
    ; the 64-entry palette LUT possible (§2.4).
    -DPEANUT_GB_12_COLOUR=1
    ; MiniGB APU sample format. Mandatory: the header #errors without one of
    ; the two format defines. S16SYS is the native-endian int16 stream the
    ; mixer sums.
    -DMINIGB_APU_AUDIO_FORMAT_S16SYS
    ; The APU header's own default, pinned explicitly so the speaker's
    ; SPEAKER_SAMPLE_RATE has a stated value to mirror.
    -DAUDIO_SAMPLE_RATE=32768

lib_deps =
    bodmer/TFT_eSPI@^2.5.43

; =============================================================================
; The same board, the same panel, the same clocks, running the gnuboy core
; instead of Peanut-GB. It inherits [env:cyd] wholesale and differs by exactly
; two things — which bridge is compiled, and the per-line hook — so an A/B
; between the two images has the core as its only variable.
;
; An image built from this environment links lib/gnuboy/, which is GPL-2.0;
; see LICENSE for what that means for distributing it.
; =============================================================================

[env:cyd-gnuboy]
extends = env:cyd

; The mirror of [env:cyd]'s filter: the Peanut-GB bridge is the one left out.
build_src_filter = +<*> -<emulator_bridge.cpp>

build_flags =
    ${env:cyd.build_flags}
    ; The vendored lcd.c is its own translation unit, so it cannot see a macro
    ; the bridge's .cpp defines. Force-including one small header is what puts
    ; the hook's definition and the declaration it calls in front of every
    ; unit, vendored ones included, without a second edit to the vendored
    ; source.
    -include $PROJECT_INCLUDE_DIR/gnuboy_hook.h

; =============================================================================
; Native host environment: pure-logic unit tests (Unity) on x86-64.
; The emulator flags below must stay in lockstep with [env:cyd]'s
; "=== Emulator ===" group, or the golden-frame test pins the wrong
; configuration.
; =============================================================================

[env:native]
platform = native
test_framework = unity

build_flags =
    ; The guard suite scans the first-party sources as text, so it needs the
    ; repository root as a compile-time string. PlatformIO expands
    ; $PROJECT_DIR; the nested quoting is what turns it into a C string
    ; literal rather than a bare token. Passed explicitly instead of relying
    ; on the working directory so a local run and CI resolve the same tree.
    -DPROJECT_DIR='"$PROJECT_DIR"'
    ; === Emulator (mirror of [env:cyd]) ===
    -DENABLE_LCD=1
    -DENABLE_SOUND=1
    -DPEANUT_GB_HIGH_LCD_ACCURACY=0
    -DPEANUT_GB_USE_DOUBLE_WIDTH_PALETTE=0
    ; Vendored default, pinned explicitly: the 12-colour path is what makes
    ; the 64-entry palette LUT possible (§2.4).
    -DPEANUT_GB_12_COLOUR=1
    ; MiniGB APU sample format. Mandatory: the header #errors without one of
    ; the two format defines. S16SYS is the native-endian int16 stream the
    ; mixer sums.
    -DMINIGB_APU_AUDIO_FORMAT_S16SYS
    ; The APU header's own default, pinned explicitly so the speaker's
    ; SPEAKER_SAMPLE_RATE has a stated value to mirror.
    -DAUDIO_SAMPLE_RATE=32768
