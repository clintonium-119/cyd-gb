; =============================================================================
; CYD-GB: Game Boy Emulator for ESP32 Cheap Yellow Display
; Board: ESP32-2432S024 (2.4" CYD, ST7789)
; =============================================================================

[env:cyd]
platform = espressif32@6.5.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
extra_scripts =
    post:scripts/post_build_timestamp.py

board_build.partitions = partitions.csv
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.flash_mode = qio

build_flags =
    -O2
    -DCORE_DEBUG_LEVEL=1
    -DUSER_SETUP_LOADED=1
    ; === ST7789 TFT Display (HSPI) ===
    -DST7789_DRIVER
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DTFT_MOSI=13
    -DTFT_MISO=12
    -DTFT_SCLK=14
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=-1
    -DTFT_BL=21
    -DTFT_BACKLIGHT_ON=HIGH
    ; 40 MHz until the design's bench item 7 sweeps 40 / 55 / 80 MHz on real hardware.
    -DSPI_FREQUENCY=40000000
    -DSPI_READ_FREQUENCY=16000000
    -DUSE_HSPI_PORT
    ; === Fonts ===
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_FONT6=1
    -DLOAD_FONT7=1
    -DLOAD_FONT8=1
    -DLOAD_GFXFF=1
    -DSMOOTH_FONT=1
    ; === SD Card (VSPI) ===
    -DSD_CS=5
    -DSD_MOSI=23
    -DSD_MISO=19
    -DSD_SCK=18
    ; === Emulator ===
    -DENABLE_LCD=1
    -DENABLE_SOUND=0
    -DPEANUT_GB_HIGH_LCD_ACCURACY=0
    -DPEANUT_GB_USE_DOUBLE_WIDTH_PALETTE=0

lib_deps =
    bodmer/TFT_eSPI@^2.5.43
